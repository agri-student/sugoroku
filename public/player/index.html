<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>農業すごろくクイズ｜プレイヤー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 1) 班選択 -->
    <section class="screen" id="screenJoin">
      <h1>農業すごろくクイズ</h1>
      <p class="lead">あなたの班をえらんでください</p>
      <div class="team-grid" id="teamGrid"></div>
      <p class="err-msg" id="joinErr"></p>
    </section>

    <!-- 2) キャラクター選択 -->
    <section class="screen" id="screenCharacter" hidden>
      <h1 id="charTitle">キャラクターをえらぼう</h1>
      <div class="char-grid" id="charGrid"></div>
      <button class="btn btn-primary big" id="charConfirm" disabled>これにする</button>
    </section>

    <!-- 3) ゲーム画面 -->
    <section class="screen game" id="screenGame" hidden>
      <header class="pheader">
        <div class="me">
          <span class="avatar" id="meAvatar"></span>
          <div>
            <div class="mename" id="meName">-</div>
            <div class="mepts"><span id="mePts">0</span> pt</div>
          </div>
        </div>
        <div class="pos-info">位置 <b id="mePos">0</b></div>
      </header>

      <div class="turn-info" id="turnInfo">-</div>

      <!-- サイコロ -->
      <div class="panel" id="dicePanel">
        <button class="dice-btn" id="rollBtn" disabled>🎲<span>サイコロを振る</span></button>
        <div class="dice-result" id="diceResult"></div>
      </div>

      <!-- クイズ -->
      <div class="panel quiz" id="quizPanel" hidden>
        <div class="q-timer" id="qTimer">残り -</div>
        <p class="q-question" id="qQuestion"></p>
        <div class="q-choices" id="qChoices"></div>
        <div class="q-feedback" id="qFeedback"></div>
      </div>

      <!-- 結果/終了 -->
      <div class="panel result" id="resultPanel" hidden></div>

      <!-- クイズ登録（事前・ゲーム中どちらでも） -->
      <div class="panel submit-panel" id="submitPanel">
        <button class="submit-toggle" id="submitToggle">
          ✏️ クイズを登録する <span class="chev" id="submitChev">▼</span>
        </button>
        <div class="submit-body" id="submitBody" hidden>
          <p class="submit-hint" id="submitHint"></p>
          <form id="studentQuizForm">
            <label>問題文
              <textarea id="sQuestion" rows="2" required placeholder="例）肥料の三要素に含まれないものは？"></textarea>
            </label>
            <div class="s-choices" id="sChoices">
              <label>選択肢1 <input type="text" data-schoice required /></label>
              <label>選択肢2 <input type="text" data-schoice required /></label>
              <label>選択肢3 <input type="text" data-schoice /></label>
              <label>選択肢4 <input type="text" data-schoice /></label>
            </div>
            <div class="s-row">
              <label>正解
                <select id="sAnswer">
                  <option value="0">選択肢1</option>
                  <option value="1">選択肢2</option>
                  <option value="2">選択肢3</option>
                  <option value="3">選択肢4</option>
                </select>
              </label>
              <label>制限時間（秒）
                <input type="number" id="sTime" min="5" max="60" value="20" />
              </label>
            </div>
            <button type="submit" class="btn btn-primary big">この問題を登録する</button>
            <p class="submit-msg" id="submitMsg"></p>
          </form>
          <ul class="my-quizzes" id="myQuizzes"></ul>
        </div>
      </div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
