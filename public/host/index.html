<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>農業すごろくクイズ｜ホスト画面</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🚜 農業すごろくクイズ <span class="sub">ホスト画面</span></h1>
    <div class="status-pill" id="statusPill">待機中</div>
    <div class="controls">
      <button id="startBtn" class="btn btn-primary">ゲーム開始</button>
      <button id="nextBtn" class="btn">手番を進める</button>
      <button id="resetBtn" class="btn btn-ghost">リセット</button>
      <button id="adminToggle" class="btn btn-ghost">クイズ管理<span class="badge" id="pendingBadge" hidden>0</span></button>
    </div>
  </header>

  <!-- ゲーム開始前の授業設定バー -->
  <section class="setup-bar" id="setupBar">
    <label class="setup-item">
      <span class="setup-label">📚 授業ファイル</span>
      <select id="lessonSelect"></select>
    </label>
    <span class="setup-info" id="lessonInfo">-</span>

    <label class="setup-item toggle-item">
      <span class="setup-label">🧑‍🏫 生徒クイズの教員承認</span>
      <span class="toggle">
        <input type="checkbox" id="approvalToggle" checked />
        <span class="slider"></span>
      </span>
      <span class="toggle-text" id="approvalText">必須</span>
    </label>
  </section>

  <main class="layout">
    <!-- 盤面 -->
    <section class="board-panel">
      <div class="turn-banner" id="turnBanner">参加を待っています…</div>
      <div id="board" class="board"></div>
    </section>

    <!-- サイド: ランキング / クイズ -->
    <aside class="side-panel">
      <div class="card">
        <h2>ランキング</h2>
        <ol id="ranking" class="ranking"></ol>
      </div>

      <div class="card quiz-card" id="quizCard" hidden>
        <h2>クイズ出題中</h2>
        <p class="quiz-meta" id="quizMeta"></p>
        <p class="quiz-question" id="quizQuestion"></p>
        <ul class="quiz-choices" id="quizChoices"></ul>
        <div class="timer-wrap">
          <div class="timer-bar" id="timerBar"></div>
          <span class="timer-text" id="timerText"></span>
        </div>
        <div class="answer-status" id="answerStatus"></div>
      </div>

      <div class="card result-card" id="resultCard" hidden>
        <h2>結果発表</h2>
        <div id="resultBody"></div>
      </div>
    </aside>
  </main>

  <!-- クイズ管理パネル -->
  <div class="admin-overlay" id="adminOverlay" hidden>
    <div class="admin-modal">
      <div class="admin-head">
        <h2>クイズ管理</h2>
        <button class="btn btn-ghost" id="adminClose">閉じる</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="pending">承認待ち<span class="badge" id="pendingTabBadge" hidden>0</span></button>
        <button class="tab" data-tab="add">教員が追加登録</button>
        <button class="tab" data-tab="list">登録済み一覧</button>
      </div>

      <!-- 承認待ち -->
      <section class="tab-body" data-body="pending">
        <p class="hint" id="pendingHint"></p>
        <ul class="pending-list" id="pendingList"></ul>
      </section>

      <!-- 追加登録フォーム -->
      <section class="tab-body" data-body="add" hidden>
        <form id="quizForm" class="quiz-form">
          <label>問題文
            <textarea id="qQuestion" rows="2" required placeholder="例）肥料の三要素に含まれないものは？"></textarea>
          </label>
          <div class="choices-grid" id="choicesGrid">
            <label>選択肢1 <input type="text" data-choice required /></label>
            <label>選択肢2 <input type="text" data-choice required /></label>
            <label>選択肢3 <input type="text" data-choice /></label>
            <label>選択肢4 <input type="text" data-choice /></label>
          </div>
          <div class="form-row">
            <label>正解の選択肢
              <select id="qAnswer">
                <option value="0">選択肢1</option>
                <option value="1">選択肢2</option>
                <option value="2">選択肢3</option>
                <option value="3">選択肢4</option>
              </select>
            </label>
            <label>制限時間（秒）
              <input type="number" id="qTime" min="5" max="60" value="20" />
            </label>
            <button type="submit" class="btn btn-primary">追加登録</button>
          </div>
          <p class="form-msg" id="formMsg"></p>
        </form>
      </section>

      <!-- 登録済み一覧 -->
      <section class="tab-body" data-body="list" hidden>
        <h3>登録済みクイズ（<span id="quizCount">0</span>問）<span class="save-note" id="saveNote"></span></h3>
        <ul class="quiz-list" id="quizList"></ul>
      </section>
    </div>
  </div>

  <!-- サイコロ演出 -->
  <div class="dice-overlay" id="diceOverlay" hidden>
    <div class="dice-box">
      <div class="dice-face" id="diceFace">🎲</div>
      <div class="dice-caption" id="diceCaption"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
